[build]
  # Netlify exécute automatiquement "npm install" avant cette commande.
  # "npm run build" utilise la version locale de Vite installée dans node_modules, sans problème de permission.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Indispensable pour React Router : évite les erreurs 404 quand on rafraîchit une page
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200